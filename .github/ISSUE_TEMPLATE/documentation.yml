name: Documentation issue
description: Report missing, incorrect, or unclear documentation
title: "[Docs]: "
labels:
  - documentation
body:
  - type: markdown
    attributes:
      value: |
        Please link the affected page or API and explain what is missing or incorrect.
  - type: textarea
    id: location
    attributes:
      label: Documentation location
      description: Add a URL or repository path.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing, misleading, or incorrect?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
      description: What should the documentation say or demonstrate?
    validations:
      required: true
