name: Feature request
description: Suggest an improvement or new API
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the user problem and expected behaviour rather than only a proposed implementation.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would this feature solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the API or behaviour you would like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Which other approaches did you consider, and why are they insufficient?
  - type: textarea
    id: examples
    attributes:
      label: Example usage
      description: Optional runnable or pseudocode example.
      render: typescript
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and roadmap items.
          required: true
